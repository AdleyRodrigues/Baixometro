[package]
name = "baixometro_api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1.43", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-br"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-native-tls", "postgres", "chrono", "uuid", "migrate", "macros", "rust_decimal"] }
rust_decimal = { version = "1.36", features = ["serde-float"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.13", features = ["v4", "serde"] }
ts-rs = { version = "10.1", features = ["uuid-impl", "chrono-impl"] }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "gzip"] }
scraper = "0.22"
quick-xml = "0.37"
argon2 = "0.5"
password-hash = { version = "0.5", features = ["rand_core"] }
jsonwebtoken = "9"
chromiumoxide = "0.9.1"
futures = "0.3"
