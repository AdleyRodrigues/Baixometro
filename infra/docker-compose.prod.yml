name: baixometro-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: baixometro-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-baixometro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-baixometro_dev}
      POSTGRES_DB: ${POSTGRES_DB:-baixometro}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-baixometro} -d $${POSTGRES_DB:-baixometro}"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.api.prod
    container_name: baixometro-api-prod
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://baixometro:baixometro_dev@postgres:5432/baixometro}
      RUST_LOG: ${RUST_LOG:-info,baixometro_api=info}
      API_PORT: ${API_PORT:-3000}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.web.prod
    container_name: baixometro-web-prod
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  pgdata_prod:

