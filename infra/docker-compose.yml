services:
  postgres:
    image: postgres:16-alpine
    container_name: baixometro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-baixometro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-baixometro_dev}
      POSTGRES_DB: ${POSTGRES_DB:-baixometro}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-baixometro} -d $${POSTGRES_DB:-baixometro}"]
      interval: 3s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.api.dev
    container_name: baixometro-api
    restart: unless-stopped
    working_dir: /app
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://baixometro:baixometro_dev@postgres:5432/baixometro}
      RUST_LOG: ${RUST_LOG:-info,baixometro_api=debug}
      API_PORT: ${API_PORT:-3000}
      TS_RS_EXPORT_DIR: /app/packages/shared-types
    command: cargo watch -x run
    ports:
      - "3000:3000"
    volumes:
      - ..:/app
      - /app/target
      - cargo_registry:/usr/local/cargo/registry
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.web.dev
    container_name: baixometro-web
    restart: unless-stopped
    working_dir: /app
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
      CI: "true"
    command: sh -c "pnpm install && pnpm --filter @baixometro/web dev --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ..:/app
      - /app/node_modules
      - /app/apps/web/node_modules
    depends_on:
      - api

volumes:
  pgdata:
  cargo_registry:
